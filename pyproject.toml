#
# Project metadata and tool configuration for the dotfiles repo. This is not an
# installable package (there is intentionally no [build-system]): the hooks and
# scripts are standalone files, run by path. The [project] table documents the
# Python dependencies they need, and the [tool.*] sections centralize test and
# type-check configuration.
#
# Run `uv sync` to materialize the dependencies into `.venv` at the repo root.

[project]
name = "dotfiles-hooks"
version = "0"
requires-python = ">=3.11"

# bashlex is a runtime dependency of the git permission gate (claude/hooks/
# gate_git.py): it parses Bash commands so the gate can find the git subcommand
# behind intervening global flags like `-C <path>`.
dependencies = [
  "bashlex",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.uv]
# This repo is not a Python package — its hooks and scripts are standalone
# files that Claude Code runs by path, never imported from an installed
# distribution. `package = false` says so: `uv sync` installs the dependencies
# declared above into `.venv` and does not try to build or install this repo
# itself. Without it uv looks for a build backend and fails.
package = false

[tool.pytest.ini_options]
# Neither directory below is a package, so put each on sys.path for the test
# modules' sibling imports — `from gate_git import ...` and
# `from distillation_backlog import ...`. Which directories hold tests is
# run_tests.sh's to say.
pythonpath = ["claude/hooks", "claude/scripts"]

[tool.mypy]
# bashlex ships no type stubs (no py.typed marker). Treat its imports as
# untyped rather than failing the strict check on a third-party gap we don't
# control; the gate_git code contains the resulting Any behind a Protocol.
[[tool.mypy.overrides]]
module = ["bashlex.*"]
ignore_missing_imports = true
